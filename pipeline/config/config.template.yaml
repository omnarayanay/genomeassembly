# Snakemake pipeline configuration template
# This file is generated by the worker process based on the sample sheet.

samples:
  - sample_id: "sample_01"
    read_type: "long"          # short | long | hybrid
    read1: null
    read2: null
    long_reads: "data/raw/sample_01/long_reads.fastq.gz"
    expected_genome_size: "5m"   # e.g., '5m' for 5 megabases
    organism_type: "bacterial"   # bacterial | eukaryotic

# Pipeline execution parameters
params:
  fastp:
    qualified_quality_phred: 15
  flye:
    iterations: 1
  quast:
    min_contig: 500
  busco:
    lineage: "bacteria_odb10"

# Resource limits (per rule)
resources:
  threads: 4
  mem_mb: 8192
