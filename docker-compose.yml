version: '3.8'

services:
  api:
    image: python:3.11-slim
    command: ["python", "-m", "uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - DATABASE_URL=sqlite:////app/data/db/runs.sqlite
      - REDIS_URL=redis://redis:6379/0

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  worker:
    image: python:3.11-slim
    command: ["python", "-m", "api.worker"]
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - DATABASE_URL=sqlite:////app/data/db/runs.sqlite
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
